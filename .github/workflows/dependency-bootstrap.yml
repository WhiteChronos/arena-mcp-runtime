name: Dependency Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arena-independent-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lock and install exact dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Commit generated lockfile when missing or changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Arena runtime dependencies"
            git push origin HEAD:feat/arena-independent-runtime
          fi
      - name: Package dependency workspace
        run: |
          tar -czf arena-node-deps.tgz node_modules
      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-node-deps
          path: |
            package-lock.json
            arena-node-deps.tgz
          retention-days: 1
